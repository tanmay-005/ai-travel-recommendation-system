{% extends "base.html" %}

{% block html_class %}dark-ready{% endblock %}

{% block title %}Explore · Yatra-Go{% endblock %}

{% block head %}
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/explore.css') }}">
{% endblock %}

{% block content %}
<div id="shell">

  <!-- TOP BAR: where you are, change it, how far to look -->
  <header id="topbar">
    <a class="brand" href="{{ url_for('pages.home') }}">Yatra-Go</a>

    <div id="where">
      <span class="where-pin" aria-hidden="true"></span>
      <span id="placeName">Pick a destination</span>
      <button type="button" id="changeBtn" class="link-btn">Change</button>
    </div>

    <form id="changeForm" class="change-form" autocomplete="off" hidden>
      <label for="changeInput" class="visually-hidden">Destination</label>
      <input id="changeInput" type="text" placeholder="Where to? e.g. Hampi" required minlength="2" maxlength="100">
      <button type="submit" class="btn-go">Go</button>
      <button type="button" id="nearMeBtn" class="btn-plain">Near me</button>
      <button type="button" id="cancelChange" class="btn-plain">Cancel</button>
    </form>

    <div id="radius" role="group" aria-label="Search radius">
      <span class="radius-label">Within</span>
      <button type="button" class="r-btn" data-km="10">10 km</button>
      <button type="button" class="r-btn" data-km="25">25 km</button>
      <button type="button" class="r-btn" data-km="50">50 km</button>
    </div>
  </header>

  <!-- LIST: three tabs over one list -->
  <aside id="panel">
    <div id="tabs" role="tablist" aria-label="What to show">
      <button type="button" role="tab" class="tab t-top" data-tab="top_spots" aria-selected="true">
        <span aria-hidden="true">★</span> Top Spots <span class="count" id="n-top_spots"></span>
      </button>
      <button type="button" role="tab" class="tab t-gem" data-tab="hidden_gems" aria-selected="false">
        <span aria-hidden="true">◆</span> Hidden Gems <span class="count" id="n-hidden_gems"></span>
      </button>
      <button type="button" role="tab" class="tab t-act" data-tab="activities" aria-selected="false">
        <span aria-hidden="true">▲</span> Things to Do <span class="count" id="n-activities"></span>
      </button>
    </div>
    <p id="tabNote" class="tab-note"></p>
    <ol id="list" aria-live="polite"></ol>
  </aside>

  <!-- MAP -->
  <div id="mapWrap">
    <div id="map"></div>
    <button type="button" id="clearRouteBtn" class="map-btn" hidden>Clear route</button>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/explore.js') }}"></script>
{% endblock %}
